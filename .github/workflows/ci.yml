name: Build, Publish, and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vlogging664/my-first-app

jobs:
  build-and-push:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vlogging664/my-first-app:1.5
            ghcr.io/vlogging664/my-first-app:${{ github.sha }}

  deploy:
    name: Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}

      - name: Update deployment image
        run: |
          oc set image deployment/my-first-app \
            nginx=ghcr.io/vlogging664/my-first-app:${{ github.sha }} \
            -n rchandran2014-dev

      - name: Wait for deployment rollout
        run: |
          oc rollout status deployment/my-first-app \
            -n rchandran2014-dev \
            --timeout=180s
